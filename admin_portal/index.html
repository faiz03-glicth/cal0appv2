<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C0 Admin — Monitoring Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, collection, query, orderBy, limit, getDocs, getDoc, doc, where, collectionGroup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  // ── REPLACE WITH YOUR FIREBASE CONFIG ─────────────────────────────────────
  // Get this from: Firebase Console → Project Settings → Your apps → SDK setup
  const firebaseConfig = {
    apiKey:            "YOUR_API_KEY",
    authDomain:        "YOUR_PROJECT.firebaseapp.com",
    projectId:         "YOUR_PROJECT_ID",
    storageBucket:     "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId:             "YOUR_APP_ID"
  };
  // ───────────────────────────────────────────────────────────────────────────

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // ── Verify admin custom claim ───────────────────────────────────────────────
  // Run this once in Firebase Admin SDK to grant access:
  //   admin.auth().setCustomUserClaims(uid, { admin: true })
  async function verifyAdminClaim(user) {
    const token = await user.getIdTokenResult();
    return token.claims.admin === true;
  }

  // ── Auth state listener ────────────────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const isAdmin = await verifyAdminClaim(user);
      if (isAdmin) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        window._adminEmail = user.email;
        document.getElementById('admin-email').textContent = user.email;
        window.firebaseDB = db;
        window.firebaseSDK = { collection, query, orderBy, limit, getDocs, getDoc, doc, where, collectionGroup };
        await window.loadPage('overview');
      } else {
        showError('Access denied. Admin privilege required.');
        await signOut(auth);
      }
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  // ── Login ──────────────────────────────────────────────────────────────────
  window.doLogin = async () => {
    const email = document.getElementById('email-input').value;
    const pass  = document.getElementById('pass-input').value;
    const btn   = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      showError(e.message.replace('Firebase: ', ''));
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  };

  window.doLogout = async () => {
    await signOut(auth);
  };

  function showError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // ── Data loading functions ─────────────────────────────────────────────────
  window.loadPage = async (page) => {
    setActivePage(page);
    const content = document.getElementById('page-content');
    content.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading…</span></div>';

    try {
      switch(page) {
        case 'overview':  content.innerHTML = await renderOverview(); break;
        case 'users':     content.innerHTML = await renderUsers(); break;
        case 'scans':     content.innerHTML = await renderScans(); break;
        case 'logs':      content.innerHTML = await renderLogs(); break;
        case 'errors':    content.innerHTML = await renderErrors(); break;
        case 'ai':        content.innerHTML = await renderAI(); break;
      }
      bindInteractions(page);
    } catch(e) {
      content.innerHTML = `<div class="error-state"><span class="mono">Error: ${e.message}</span><p>Check Firebase connection and security rules.</p></div>`;
    }
  };

  // ── OVERVIEW ───────────────────────────────────────────────────────────────
  async function renderOverview() {
    const { collection, query, orderBy, limit, getDocs, collectionGroup } = window.firebaseSDK;
    const db = window.firebaseDB;

    // Parallel fetches
    const [usersSnap, logsSnap] = await Promise.all([
      getDocs(collection(db, 'users')),
      getDocs(query(collectionGroup(db, 'events'), orderBy('timestamp', 'desc'), limit(100)))
    ]);

    const userCount = usersSnap.size;
    const logs = logsSnap.docs.map(d => d.data());
    const scanLogs = logs.filter(l => l.eventType === 'scanAiAnalysed' || l.eventType === 'aiPredictionSuccess' || l.eventType === 'aiPredictionLowConfidence' || l.eventType === 'scanFailed');
    const errorLogs = logs.filter(l => l.eventType === 'unexpectedError' || l.eventType === 'apiCallFailed' || l.eventType === 'firebaseError');
    const lowConfLogs = logs.filter(l => l.eventType === 'aiPredictionLowConfidence');
    const successLogs = logs.filter(l => l.eventType === 'aiPredictionSuccess');
    const avgConf = successLogs.length > 0
      ? (successLogs.reduce((s, l) => s + (l.aiConfidence || 0), 0) / successLogs.length * 100).toFixed(1)
      : '—';

    // 30-day chart: group by day
    const dayMap = {};
    for(let i=29; i>=0; i--) {
      const d = new Date(); d.setDate(d.getDate()-i);
      dayMap[d.toDateString()] = 0;
    }
    scanLogs.forEach(l => {
      const d = new Date(l.timestamp).toDateString();
      if (dayMap[d] !== undefined) dayMap[d]++;
    });
    const chartBars = Object.values(dayMap);
    const chartMax = Math.max(...chartBars, 1);

    const recentLogs = logs.slice(0, 8);

    return `
    <div class="overview-grid">
      <div class="stat-card animate-in" style="--d:0ms">
        <div class="stat-icon">⬡</div>
        <div class="stat-val">${userCount}</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-card animate-in" style="--d:60ms">
        <div class="stat-icon">◈</div>
        <div class="stat-val">${scanLogs.length}</div>
        <div class="stat-label">Recent Scans</div>
      </div>
      <div class="stat-card animate-in" style="--d:120ms">
        <div class="stat-icon">⚑</div>
        <div class="stat-val">${errorLogs.length}</div>
        <div class="stat-label">Errors (recent)</div>
      </div>
      <div class="stat-card animate-in" style="--d:180ms">
        <div class="stat-icon">◉</div>
        <div class="stat-val">${avgConf}%</div>
        <div class="stat-label">Avg AI Confidence</div>
      </div>
    </div>

    <div class="two-col animate-in" style="--d:240ms">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Scans — last 30 days</span>
          <span class="panel-sub">${scanLogs.length} total</span>
        </div>
        <div class="chart-wrap">
          <div class="bar-chart">
            ${chartBars.map((v,i) => `
              <div class="bar-col">
                <div class="bar-fill ${i===29?'bar-today':''}" style="height:${Math.round(v/chartMax*100)}%" title="Day ${i+1}: ${v} scans"></div>
              </div>`).join('')}
          </div>
          <div class="chart-legend">
            <span>30d ago</span><span>Today</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Recent Activity</span>
          <button class="panel-link" onclick="window.loadPage('logs')">View all →</button>
        </div>
        <div class="log-list">
          ${recentLogs.map(l => `
            <div class="log-row">
              <span class="log-time">${formatTime(l.timestamp)}</span>
              <span class="event-badge ${eventClass(l.eventType)}">${shortEvent(l.eventType)}</span>
              <span class="log-uid mono">${(l.uid||'').substring(0,6)}…</span>
            </div>`).join('') || '<div class="empty-state">No recent activity</div>'}
        </div>
      </div>
    </div>

    <div class="two-col animate-in" style="--d:300ms">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">AI Verdict Split</span>
        </div>
        <div class="verdict-split">
          <div class="verdict-item clean">
            <div class="verdict-num">${successLogs.length}</div>
            <div class="verdict-lbl">CLEAN</div>
          </div>
          <div class="verdict-divider"></div>
          <div class="verdict-item low">
            <div class="verdict-num">${lowConfLogs.length}</div>
            <div class="verdict-lbl">LOW CONF</div>
          </div>
          <div class="verdict-divider"></div>
          <div class="verdict-item fail">
            <div class="verdict-num">${logs.filter(l=>l.eventType==='scanFailed').length}</div>
            <div class="verdict-lbl">FAILED</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Error Summary</span>
          <button class="panel-link" onclick="window.loadPage('errors')">Inspect →</button>
        </div>
        ${Object.entries(groupBy(errorLogs, 'errorCode')).slice(0,4).map(([code, items]) => `
          <div class="error-row">
            <span class="mono err-code">${code || 'UNKNOWN'}</span>
            <span class="err-count">${items.length}×</span>
          </div>`).join('') || '<div class="empty-state">No errors logged</div>'}
      </div>
    </div>`;
  }

  // ── USERS ──────────────────────────────────────────────────────────────────
  async function renderUsers() {
    const { collection, getDocs, collectionGroup, query, orderBy, limit, where } = window.firebaseSDK;
    const db = window.firebaseDB;

    const usersSnap = await getDocs(collection(db, 'users'));
    const logsSnap = await getDocs(query(collectionGroup(db, 'events'), orderBy('timestamp','desc'), limit(500)));

    const users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const logs = logsSnap.docs.map(d => d.data());

    // Build per-user stats
    const userStats = {};
    logs.forEach(l => {
      if (!userStats[l.uid]) userStats[l.uid] = { scans: 0, foodLogs: 0, errors: 0, lastSeen: null };
      if (l.eventType?.includes('scan') || l.eventType?.includes('Scan')) userStats[l.uid].scans++;
      if (l.eventType === 'foodLogAdded') userStats[l.uid].foodLogs++;
      if (l.eventType?.includes('Error') || l.eventType?.includes('Failed')) userStats[l.uid].errors++;
      const ts = new Date(l.timestamp);
      if (!userStats[l.uid].lastSeen || ts > userStats[l.uid].lastSeen) userStats[l.uid].lastSeen = ts;
    });

    const loginEvents = logs.filter(l => l.eventType === 'userLogin');
    const loginsByUser = groupBy(loginEvents, 'uid');

    return `
    <div class="toolbar animate-in" style="--d:0ms">
      <input class="search-input" id="user-search" placeholder="Filter by UID or name…" oninput="filterTable('user-table', this.value)">
      <span class="toolbar-count">${users.length} users</span>
    </div>
    <div class="panel animate-in" style="--d:60ms">
      <div class="panel-header">
        <span class="panel-title">All Users</span>
        <span class="panel-sub readonly-badge">🔒 Read-only · cannot modify user data</span>
      </div>
      <div class="table-wrap">
        <table id="user-table">
          <thead><tr>
            <th>UID</th><th>Name</th><th>Gender</th><th>Goal</th>
            <th>Scans</th><th>Food logs</th><th>Logins</th><th>Last seen</th><th></th>
          </tr></thead>
          <tbody>
            ${users.map(u => {
              const stats = userStats[u.userId] || {};
              const logins = (loginsByUser[u.userId]||[]).length;
              return `<tr data-search="${u.userId} ${u.userName||''} ${u.userEmail||''}">
                <td class="mono uid-cell">${u.userId?.substring(0,8)}…</td>
                <td class="name-cell">${u.userName || '—'}</td>
                <td>${u.gender || '—'}</td>
                <td><span class="goal-pill">${u.goal || '—'}</span></td>
                <td>${stats.scans || 0}</td>
                <td>${stats.foodLogs || 0}</td>
                <td>${logins}</td>
                <td class="muted">${stats.lastSeen ? relTime(stats.lastSeen) : 'never'}</td>
                <td><button class="row-btn" onclick="window.viewUserLogs('${u.userId}')">Logs</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  // ── SCANS ──────────────────────────────────────────────────────────────────
  async function renderScans(filterUid) {
    const { collectionGroup, query, orderBy, limit, where, getDocs } = window.firebaseSDK;
    const db = window.firebaseDB;

    let q = query(collectionGroup(db, 'events'),
      where('eventType', 'in', ['aiPredictionSuccess','aiPredictionLowConfidence','scanFailed','scanAiAnalysed']),
      orderBy('timestamp','desc'), limit(50));
    const snap = await getDocs(q);
    const scans = snap.docs.map(d => d.data());
    const filtered = filterUid ? scans.filter(s => s.uid === filterUid) : scans;

    return `
    <div class="toolbar animate-in" style="--d:0ms">
      <input class="search-input" id="scan-search" placeholder="Filter by UID, product, verdict…" oninput="filterTable('scan-table', this.value)">
      <span class="toolbar-count">${filtered.length} scans</span>
    </div>
    <div class="panel animate-in" style="--d:60ms">
      <div class="panel-header">
        <span class="panel-title">Scan Debug Inspector</span>
        <span class="panel-sub">Click any row to expand full debug trace</span>
      </div>
      <div class="table-wrap">
        <table id="scan-table">
          <thead><tr>
            <th>Time</th><th>UID</th><th>Verdict</th><th>Confidence</th>
            <th>Duration</th><th>Platform</th><th>App ver.</th><th></th>
          </tr></thead>
          <tbody>
            ${filtered.map((s,i) => {
              const verdict = s.aiPredictionLabel || (s.eventType === 'scanFailed' ? 'FAILED' : '—');
              const conf = s.aiConfidence != null ? Math.round(s.aiConfidence*100) : null;
              const isLow = s.eventType === 'aiPredictionLowConfidence';
              const isFail = s.eventType === 'scanFailed';
              return `<tr data-search="${s.uid||''} ${verdict} ${s.platform||''}" onclick="toggleScanDetail(${i})" style="cursor:pointer">
                <td class="mono">${formatTime(s.timestamp)}</td>
                <td class="mono uid-cell">${(s.uid||'').substring(0,8)}…</td>
                <td><span class="verdict-badge ${isFail?'vbad-fail':isLow?'vbad-low':'vbad-ok'}">${verdict}</span></td>
                <td>
                  ${conf!=null ? `<div class="conf-wrap"><div class="conf-bar-mini"><div class="conf-fill-mini" style="width:${conf}%;background:${conf>70?'var(--green)':conf>50?'var(--amber)':'var(--red)'}"></div></div><span class="mono">${conf}%</span></div>` : '<span class="muted">—</span>'}
                </td>
                <td class="mono">${s.durationMs ? s.durationMs+'ms' : '—'}</td>
                <td><span class="plat-badge">${s.platform || '—'}</span></td>
                <td class="mono muted">${s.appVersion || '—'}</td>
                <td class="mono muted">▼</td>
              </tr>
              <tr id="scan-detail-${i}" style="display:none">
                <td colspan="8">
                  <div class="scan-detail">
                    <div class="sd-section">
                      <div class="sd-label">OCR Extracted Text</div>
                      <div class="sd-ocr mono">${s.ocrExtractedText || '<span class="muted">Not captured</span>'}</div>
                    </div>
                    <div class="sd-grid">
                      <div class="sd-section">
                        <div class="sd-label">Firebase Storage</div>
                        <div class="mono muted">${s.scanImagePath || 'No image path logged'}</div>
                      </div>
                      <div class="sd-section">
                        <div class="sd-label">Flagged Ingredients</div>
                        <div>${s.flaggedIngredients?.length ? s.flaggedIngredients.map(f=>`<span class="flag-chip">${f}</span>`).join('') : '<span class="muted">None</span>'}</div>
                      </div>
                      <div class="sd-section">
                        <div class="sd-label">Session Trace</div>
                        <div class="mono muted trace-cell">${s.sessionId || '—'}</div>
                      </div>
                      <div class="sd-section">
                        <div class="sd-label">Error</div>
                        <div class="mono muted">${s.errorMessage || '—'}</div>
                      </div>
                    </div>
                  </div>
                </td>
              </tr>`;
            }).join('') || '<tr><td colspan="8"><div class="empty-state">No scan events logged yet</div></td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  // ── ACTIVITY FEED ──────────────────────────────────────────────────────────
  async function renderLogs(filterUid) {
    const { collectionGroup, query, orderBy, limit, getDocs } = window.firebaseSDK;
    const db = window.firebaseDB;

    const snap = await getDocs(query(collectionGroup(db,'events'), orderBy('timestamp','desc'), limit(200)));
    let logs = snap.docs.map(d => d.data());
    if (filterUid) logs = logs.filter(l => l.uid === filterUid);

    const eventTypes = [...new Set(logs.map(l => l.eventType).filter(Boolean))].sort();

    return `
    <div class="toolbar animate-in" style="--d:0ms">
      <input class="search-input" id="log-search" placeholder="Filter events…" oninput="filterTable('log-table', this.value)">
      <select class="filter-select" id="event-filter" onchange="filterByEvent()">
        <option value="">All event types</option>
        ${eventTypes.map(t => `<option value="${t}">${t}</option>`).join('')}
      </select>
      <span class="toolbar-count">${logs.length} events</span>
    </div>
    <div class="panel animate-in" style="--d:60ms">
      <div class="panel-header">
        <span class="panel-title">${filterUid ? `Events for ${filterUid.substring(0,10)}…` : 'Live Activity Feed'}</span>
        ${filterUid ? `<button class="panel-link" onclick="window.loadPage('logs')">Clear filter</button>` : ''}
      </div>
      <div class="table-wrap">
        <table id="log-table">
          <thead><tr>
            <th>Timestamp</th><th>UID</th><th>Event</th><th>Session</th><th>Platform</th><th>Details</th>
          </tr></thead>
          <tbody>
            ${logs.map(l => `
              <tr data-search="${l.eventType||''} ${l.uid||''}" data-event="${l.eventType||''}">
                <td class="mono">${formatTime(l.timestamp)}</td>
                <td><span class="uid-link mono" onclick="window.viewUserLogs('${l.uid}')">${(l.uid||'').substring(0,8)}…</span></td>
                <td><span class="event-badge ${eventClass(l.eventType)}">${l.eventType||'unknown'}</span></td>
                <td class="mono muted">${(l.sessionId||'').substring(0,8)}</td>
                <td>${l.platform ? `<span class="plat-badge">${l.platform}</span>` : '<span class="muted">—</span>'}</td>
                <td class="muted">${logDetail(l)}</td>
              </tr>`).join('') || '<tr><td colspan="6"><div class="empty-state">No events logged yet</div></td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  // ── ERRORS ─────────────────────────────────────────────────────────────────
  async function renderErrors() {
    const { collectionGroup, query, orderBy, limit, where, getDocs } = window.firebaseSDK;
    const db = window.firebaseDB;

    const snap = await getDocs(query(collectionGroup(db,'events'),
      where('eventType','in',['unexpectedError','apiCallFailed','firebaseError','aiModelLoadFailed','scanFailed']),
      orderBy('timestamp','desc'), limit(200)));
    const errors = snap.docs.map(d => d.data());
    const grouped = groupBy(errors, l => l.errorCode || l.eventType || 'UNKNOWN');

    return `
    <div class="toolbar animate-in" style="--d:0ms">
      <span class="toolbar-count">${errors.length} total errors · ${Object.keys(grouped).length} unique codes</span>
    </div>
    ${Object.entries(grouped).sort((a,b)=>b[1].length-a[1].length).map(([code, items], gi) => `
      <div class="error-panel animate-in" style="--d:${gi*60}ms">
        <div class="error-header" onclick="toggleErrorPanel(${gi})">
          <div class="error-header-left">
            <span class="mono err-title">${code}</span>
            <span class="err-last">Last: ${formatTime(items[0]?.timestamp)}</span>
          </div>
          <div class="error-header-right">
            <span class="err-badge">${items.length}×</span>
            <span class="err-toggle" id="etog-${gi}">▼</span>
          </div>
        </div>
        <div class="error-body" id="ebody-${gi}" style="display:none">
          <div class="err-msg mono">${items[0]?.errorMessage || '—'}</div>
          ${items[0]?.stackTraceSnippet ? `
            <div class="sd-label" style="margin-top:12px">Stack trace</div>
            <div class="sd-ocr mono">${items[0].stackTraceSnippet}</div>
          ` : ''}
          <div class="err-users">
            <span class="sd-label">Affected users</span>
            ${[...new Set(items.map(i=>i.uid).filter(Boolean))].map(uid =>
              `<span class="uid-link mono" onclick="window.viewUserLogs('${uid}')">${uid.substring(0,8)}…</span>`
            ).join('')}
          </div>
          <div class="err-sessions">
            ${items.slice(0,5).map(i => `
              <div class="err-session-row">
                <span class="mono muted">${formatTime(i.timestamp)}</span>
                <span class="plat-badge">${i.platform||'?'}</span>
                <span class="mono muted">${i.appVersion||'—'}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>`).join('') || '<div class="empty-state panel" style="padding:32px;text-align:center">No errors logged — system is healthy</div>'}`;
  }

  // ── AI STATS ───────────────────────────────────────────────────────────────
  async function renderAI() {
    const { collectionGroup, query, orderBy, limit, where, getDocs } = window.firebaseSDK;
    const db = window.firebaseDB;

    const snap = await getDocs(query(collectionGroup(db,'events'),
      where('eventType','in',['aiPredictionSuccess','aiPredictionLowConfidence','aiPredictionFailed','aiModelLoadFailed','scanAiAnalysed']),
      orderBy('timestamp','desc'), limit(500)));
    const events = snap.docs.map(d => d.data());

    const success = events.filter(e => e.eventType === 'aiPredictionSuccess');
    const lowConf = events.filter(e => e.eventType === 'aiPredictionLowConfidence');
    const failed  = events.filter(e => e.eventType === 'aiPredictionFailed');
    const loadFail= events.filter(e => e.eventType === 'aiModelLoadFailed');

    const allWithConf = events.filter(e => e.aiConfidence != null);
    const avgConf = allWithConf.length > 0
      ? (allWithConf.reduce((s,e) => s+e.aiConfidence,0) / allWithConf.length * 100).toFixed(1)
      : '—';
    const avgDur = events.filter(e=>e.durationMs).length > 0
      ? Math.round(events.filter(e=>e.durationMs).reduce((s,e)=>s+e.durationMs,0) / events.filter(e=>e.durationMs).length)
      : '—';

    const buckets = [
      { label:'< 50%', count: allWithConf.filter(e=>e.aiConfidence<0.5).length,  color:'var(--red)' },
      { label:'50–70%', count: allWithConf.filter(e=>e.aiConfidence>=0.5&&e.aiConfidence<0.7).length, color:'var(--amber)' },
      { label:'70–90%', count: allWithConf.filter(e=>e.aiConfidence>=0.7&&e.aiConfidence<0.9).length, color:'var(--green)' },
      { label:'> 90%',  count: allWithConf.filter(e=>e.aiConfidence>=0.9).length, color:'var(--accent)' },
    ];
    const bucketMax = Math.max(...buckets.map(b=>b.count), 1);

    // Top flagged ingredients across all scans
    const flagMap = {};
    events.forEach(e => (e.flaggedIngredients||[]).forEach(f => { flagMap[f] = (flagMap[f]||0)+1; }));
    const topFlagged = Object.entries(flagMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const flagMax = topFlagged[0]?.[1] || 1;

    return `
    <div class="overview-grid animate-in" style="--d:0ms">
      <div class="stat-card">
        <div class="stat-icon">◈</div>
        <div class="stat-val">${events.length}</div>
        <div class="stat-label">Total Inferences</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">◉</div>
        <div class="stat-val">${avgConf}%</div>
        <div class="stat-label">Avg Confidence</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱</div>
        <div class="stat-val">${avgDur}ms</div>
        <div class="stat-label">Avg Duration</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⚑</div>
        <div class="stat-val">${loadFail.length}</div>
        <div class="stat-label">Model Load Failures</div>
      </div>
    </div>

    <div class="two-col animate-in" style="--d:120ms">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Confidence Distribution</span></div>
        ${buckets.map(b => `
          <div class="bucket-row">
            <span class="bucket-label mono">${b.label}</span>
            <div class="bucket-bar-wrap">
              <div class="bucket-bar" style="width:${Math.round(b.count/bucketMax*100)}%;background:${b.color}"></div>
            </div>
            <span class="bucket-count">${b.count}</span>
          </div>`).join('')}
        <div class="reliability-notes">
          <div class="note-row"><span class="note-dot green"></span><span>OCR quality gate: scans below 0.40 skip AI, user is warned</span></div>
          <div class="note-row"><span class="note-dot amber"></span><span>Confidence < 50%: logged as <span class="mono">aiPredictionLowConfidence</span></span></div>
          <div class="note-row"><span class="note-dot blue"></span><span>Rule-based fallback always active: Glycine, Taurine, etc.</span></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><span class="panel-title">Top Flagged Ingredients</span></div>
        ${topFlagged.length > 0 ? topFlagged.map(([name, count], i) => `
          <div class="flagged-row">
            <span class="flagged-rank">${i+1}</span>
            <span class="flagged-name mono">${name}</span>
            <div class="flagged-bar-wrap">
              <div class="flagged-bar" style="width:${Math.round(count/flagMax*100)}%"></div>
            </div>
            <span class="flagged-count">${count}</span>
          </div>`).join('') : '<div class="empty-state">No flagged ingredients logged yet</div>'}
      </div>
    </div>

    <div class="panel animate-in" style="--d:240ms">
      <div class="panel-header"><span class="panel-title">Model Reliability Notes</span></div>
      <div class="notes-grid">
        ${[
          ['OCR Quality Gate', 'Scans with OCR quality score < 0.40 skip AI inference entirely. The user sees a "scan quality too low" notice and the event is logged as <span class="mono">aiPredictionLowConfidence</span> with the quality score in the error message.', 'amber'],
          ['Confidence Threshold', 'Predictions below 50% trigger a user-visible warning and are always logged for admin review. The rule-based engine still runs in parallel as a fallback.', 'amber'],
          ['Rule-Based Fallback', 'Even when AI confidence is low or OCR quality fails, the AminoSpikeDetectorService scans for known spiking agents: Glycine, Taurine, Creatine, Beta-Alanine, Arginine. This catches the most common cases.', 'green'],
          ['Session Tracing', 'Every scan stores sessionId, uid, platform, appVersion, ocrText, aiLabel, confidence, duration, and flaggedIngredients. Admins can replay the full pipeline from any scan log.', 'blue'],
        ].map(([title, desc, color]) => `
          <div class="note-card note-${color}">
            <div class="note-title">${title}</div>
            <div class="note-desc">${desc}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  window.viewUserLogs = (uid) => {
    setActivePage('logs');
    const content = document.getElementById('page-content');
    content.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading user logs…</span></div>';
    renderLogs(uid).then(html => {
      content.innerHTML = html;
      bindInteractions('logs');
    });
  };

  function groupBy(arr, key) {
    const fn = typeof key === 'function' ? key : o => o[key];
    return arr.reduce((acc, item) => {
      const k = fn(item) || 'UNKNOWN';
      (acc[k] = acc[k] || []).push(item);
      return acc;
    }, {});
  }

  function formatTime(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return isNaN(d) ? ts : d.toLocaleString('en-MY', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function relTime(d) {
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff/60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins/60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs/24)}d ago`;
  }

  function eventClass(type) {
    if (!type) return 'ev-gray';
    if (type.includes('Error') || type.includes('Failed') || type.includes('failed')) return 'ev-red';
    if (type.includes('Low') || type.includes('Warning') || type.includes('Slow')) return 'ev-amber';
    if (type.includes('success') || type.includes('Success') || type.includes('added') || type.includes('login') || type.includes('Login')) return 'ev-green';
    if (type.includes('scan') || type.includes('Scan') || type.includes('ai') || type.includes('Ai')) return 'ev-blue';
    return 'ev-gray';
  }

  function shortEvent(type) {
    if (!type) return 'unknown';
    return type.replace(/([A-Z])/g, ' $1').trim().toLowerCase().substring(0,22);
  }

  function logDetail(l) {
    if (l.foodName) return `${l.foodName} · ${l.calories||0} kcal`;
    if (l.aiConfidence != null) return `confidence: ${Math.round(l.aiConfidence*100)}%`;
    if (l.errorMessage) return l.errorMessage.substring(0,40)+'…';
    if (l.searchQuery) return `"${l.searchQuery}" (${l.searchResultCount||0} results)`;
    if (l.durationMs) return `${l.durationMs}ms`;
    return '—';
  }

  window.toggleScanDetail = (i) => {
    const row = document.getElementById(`scan-detail-${i}`);
    if (!row) return;
    row.style.display = row.style.display === 'none' ? '' : 'none';
  };

  window.toggleErrorPanel = (i) => {
    const body = document.getElementById(`ebody-${i}`);
    const tog  = document.getElementById(`etog-${i}`);
    if (!body) return;
    const hidden = body.style.display === 'none';
    body.style.display = hidden ? '' : 'none';
    tog.textContent = hidden ? '▲' : '▼';
  };
</script>

<style>
:root {
  --bg0: #090c10;

  --bg2: #171d2e;

  --green: #22d3a0;
  --green-bg: rgba(34,211,160,0.1);
  --amber: #f5a623;
  --amber-bg: rgba(245,166,35,0.1);
  --red: #f04b4b;
  --red-bg: rgba(240,75,75,0.1);

}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg0);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
}

.mono { font-family: var(--font-mono); }

/* ── Login ──────────────────────────────────────────────────────── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(93,232,178,0.04) 0%, transparent 70%), var(--bg0);
}

.login-card {
  width: 360px;
  background: var(--bg1);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 36px;
}

.login-logo {
  font-family: var(--font-mono);
  font-size: 22px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.login-sub {
  font-size: 12px;
  color: var(--muted2);
  margin-bottom: 32px;
}

.login-field {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-sans);
  margin-bottom: 10px;

}
.login-field:focus { border-color: var(--accent); }

.login-btn {
  width: 100%;

  color: var(--bg0);
  border: none;
  border-radius: 7px;
  padding: 11px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-sans);

}
.login-btn:hover { opacity: 0.9; }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

#login-error {
  display: none;
  background: var(--red-bg);
  border: 1px solid rgba(240,75,75,0.3);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--red);
  margin-bottom: 14px;
}

/* ── App shell ──────────────────────────────────────────────────── */
#app {
  display: none;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ────────────────────────────────────────────────────── */
.sidebar {
  width: 210px;
  flex-shrink: 0;
  background: var(--bg1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;

}

.sidebar-brand {

}

.brand-name {

}

.brand-sub {

nav { flex: 1; padding: 10px 0; overflow-y: auto; }

.nav-section {

.nav-item {

.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(93,232,178,0.05); }

.nav-dot {
  width: 5px;

}

.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
}

.admin-status {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.status-dot {
  width: 6px; height: 6px;

}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

#admin-email {
  font-size: 10px;
  color: var(--muted2);
  overflow: hidden;
  text-overflow: ellipsis;

}

.logout-btn {
  width: 100%;
  background: none;
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 5px;
  color: var(--muted2);
  font-size: 11px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all 0.15s;
}
.logout-btn:hover { color: var(--text); border-color: var(--border2); }

.readonly-badge {

  color: var(--amber);
  background: var(--amber-bg);
  border: 1px solid rgba(245,166,35,0.2);

}

/* ── Main area ──────────────────────────────────────────────────── */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: var(--bg1);
  border-bottom: 1px solid var(--border);

.topbar-title {

}
.error-state p { color: var(--muted2); margin-top: 8px; }

  padding: 24px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

/* ── Panels ─────────────────────────────────────────────────────── */
.panel {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title { font-size: 12px; font-weight: 600; color: var(--text); }
.panel-sub { font-size: 10px; color: var(--muted2); }
.panel-link {
  background: none; border: none; cursor: pointer;
  color: var(--accent); font-size: 11px; font-family: var(--font-sans);
  padding: 0;
}
.panel-link:hover { text-decoration: underline; }

/* ── Stats grid ─────────────────────────────────────────────────── */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.stat-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;

  content: '';

.stat-icon { font-size: 18px; color: var(--muted); opacity: 0.4; float: right; }
.stat-val { font-size: 28px; font-weight: 600; color: var(--text); letter-spacing: -1px; margin: 4px 0 4px; }
.stat-label { font-size: 10px; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.5px; }

/* ── Two-col ────────────────────────────────────────────────────── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ── Chart ──────────────────────────────────────────────────────── */
.chart-wrap { padding: 12px 16px 8px; }

.bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.bar-fill { width: 100%; min-height: 2px; background: var(--bg3); border-radius: 2px 2px 0 0; transition: background 0.2s; }
.bar-fill:hover { background: rgba(93,232,178,0.3); }
.bar-today { background: rgba(93,232,178,0.25); border: 1px solid rgba(93,232,178,0.4); }
.chart-legend { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); padding-top: 4px; }

/* ── Log list (in overview) ─────────────────────────────────────── */
.log-list { padding: 8px 16px; }
.log-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
.log-row:last-child { border-bottom: none; }
.log-time { font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 80px; flex-shrink: 0; }

/* ── Verdict split ──────────────────────────────────────────────── */
.verdict-split { display: flex; align-items: center; justify-content: space-around; padding: 24px; }
.verdict-item { text-align: center; }
.verdict-num { font-size: 28px; font-weight: 600; letter-spacing: -1px; }
.verdict-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted2); margin-top: 2px; }
.verdict-divider { width: 1px; height: 50px; background: var(--border); }
.clean .verdict-num { color: var(--green); }
.low .verdict-num { color: var(--amber); }

.error-row:last-child { border-bottom: none; }

/* ── Tables ─────────────────────────────────────────────────────── */

tr[style*="display:none"]:hover td { background: none; }

.uid-cell { font-size: 10px; color: var(--muted); }
.name-cell { color: var(--text); font-weight: 500; }
.muted { color: var(--muted2); }

.uid-link { color: var(--blue); cursor: pointer; font-size: 10px; }
.uid-link:hover { text-decoration: underline; }

/* ── Badges ─────────────────────────────────────────────────────── */
.event-badge {
  font-size: 9px;
  font-weight: 500;
  border-radius: 3px;
  padding: 2px 6px;
  font-family: var(--font-mono);

}
.ev-green  { background: var(--green-bg);  color: var(--green); }
.ev-red    { background: var(--red-bg);    color: var(--red); }
.ev-amber  { background: var(--amber-bg);  color: var(--amber); }
.ev-blue   { background: var(--blue-bg);   color: var(--blue); }

.vbad-low  { background: var(--amber-bg); color: var(--amber); }

.flag-chip {
  display: inline-block;
  background: var(--amber-bg);
  color: var(--amber);
  border-radius: 3px;
  padding: 2px 6px;
  font-size: 10px;
  margin-right: 4px;
  margin-bottom: 2px;
}

/* ── Scan detail ────────────────────────────────────────────────── */
.scan-detail {
  background: var(--bg2);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  font-size: 11px;
}

.sd-section { display: flex; flex-direction: column; gap: 5px; }
.sd-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
.sd-ocr {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px;
  font-size: 10px;
  color: var(--muted2);
  line-height: 1.7;
  max-height: 90px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}
.sd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.trace-cell { font-size: 9px; word-break: break-all; }

/* ── Confidence bar inline ──────────────────────────────────────── */
.conf-wrap { display: flex; align-items: center; gap: 6px; }
.conf-bar-mini { width: 60px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
.conf-fill-mini { height: 100%; border-radius: 2px; }

/* ── Toolbar ────────────────────────────────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.search-input {
  background: var(--bg1);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 7px 12px;
  color: var(--text);
  font-size: 12px;
  font-family: var(--font-sans);
  outline: none;
  width: 240px;
}
.search-input:focus { border-color: rgba(93,232,178,0.4); }
.search-input::placeholder { color: var(--muted); }

.filter-select {
  background: var(--bg1);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 7px 10px;
  color: var(--text);
  font-size: 11px;
  font-family: var(--font-sans);
  outline: none;
  cursor: pointer;
}

.toolbar-count { font-size: 11px; color: var(--muted); margin-left: auto; }

.row-btn {
  background: var(--blue-bg);
  border: 1px solid rgba(75,158,245,0.2);
  border-radius: 4px;
  color: var(--blue);
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 3px 8px;
  cursor: pointer;
}
.row-btn:hover { background: rgba(75,158,245,0.2); }

/* ── Error panels ───────────────────────────────────────────────── */
.error-panel {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.error-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg2);
  cursor: pointer;
  user-select: none;
}
.error-header:hover { background: var(--bg3); }

.error-header-left { display: flex; flex-direction: column; gap: 3px; }
.err-title { color: var(--red); font-size: 12px; }
.err-last { font-size: 10px; color: var(--muted); }
.error-header-right { display: flex; align-items: center; gap: 10px; }
.err-badge { background: var(--red-bg); color: var(--red); font-weight: 700; border-radius: 10px; padding: 2px 8px; font-size: 11px; }
.err-toggle { font-size: 10px; color: var(--muted); }

.error-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.err-msg { color: var(--muted2); font-size: 11px; line-height: 1.6; }
.err-users { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.err-sessions { display: flex; flex-direction: column; gap: 4px; }
.err-session-row { display: flex; align-items: center; gap: 10px; font-size: 10px; }

/* ── AI stats ───────────────────────────────────────────────────── */
.bucket-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
.bucket-row:last-of-type { border-bottom: none; }
.bucket-label { font-size: 10px; width: 50px; flex-shrink: 0; }
.bucket-bar-wrap { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.bucket-bar { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.bucket-count { font-size: 11px; color: var(--muted2); width: 40px; text-align: right; }

.reliability-notes { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
.note-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted2); }
.note-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.note-dot.green { background: var(--green); }
.note-dot.amber { background: var(--amber); }
.note-dot.blue  { background: var(--blue); }

.flagged-row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--border); }
.flagged-row:last-child { border-bottom: none; }
.flagged-rank { font-size: 10px; color: var(--muted); width: 16px; }
.flagged-name { font-size: 11px; color: var(--text); width: 120px; }
.flagged-bar-wrap { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.flagged-bar { height: 100%; background: var(--red); border-radius: 2px; }
.flagged-count { font-size: 10px; color: var(--muted2); width: 30px; text-align: right; }

.notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
.note-card { padding: 14px; border-radius: 6px; border-left: 3px solid; }
.note-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.note-desc { font-size: 11px; color: var(--muted2); line-height: 1.6; }
.note-amber { background: rgba(245,166,35,0.06); border-color: var(--amber); }
.note-green { background: rgba(34,211,160,0.06); border-color: var(--green); }
.note-blue  { background: rgba(75,158,245,0.06); border-color: var(--blue); }
.note-red   { background: rgba(240,75,75,0.06);  border-color: var(--red); }

/* ── Animations ─────────────────────────────────────────────────── */
.animate-in {
  animation: fadeUp 0.4s ease both;
  animation-delay: var(--d, 0ms);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* ── Scrollbar ──────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 5px; }
</style>
</head>
<body>

    <div class="sidebar-footer">

  <div class="main-area">

    <div id="page-content"></div>
  </div>
</div>

<script>
// ── Page routing helpers ─────────────────────────────────────────────────────
const PAGE_META = {
  overview: { title: 'Overview Dashboard',    crumb: 'C0Admin / Overview' },
  users:    { title: 'User Management',       crumb: 'C0Admin / Users' },
  scans:    { title: 'Scan Debug Inspector',  crumb: 'C0Admin / Scan Inspector' },
  logs:     { title: 'Live Activity Feed',    crumb: 'C0Admin / Activity' },
  errors:   { title: 'Error Monitor',         crumb: 'C0Admin / Errors' },
  ai:       { title: 'AI Model Analytics',    crumb: 'C0Admin / AI Stats' },
};

function setActivePage(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById(`nav-${page}`);
  if (nav) nav.classList.add('active');
  const meta = PAGE_META[page] || {};
  document.getElementById('topbar-title').textContent = meta.title || '';
  document.getElementById('topbar-crumb').textContent = meta.crumb || '';
}

function filterTable(tableId, query) {
  const rows = document.querySelectorAll(`#${tableId} tbody tr:not([id^="scan-detail"])`);
  const q = query.toLowerCase();
  rows.forEach(row => {
    const search = (row.dataset.search || row.textContent).toLowerCase();
    row.style.display = search.includes(q) ? '' : 'none';
  });
}

function filterByEvent() {
  const type = document.getElementById('event-filter').value;
  document.querySelectorAll('#log-table tbody tr').forEach(row => {
    row.style.display = !type || row.dataset.event === type ? '' : 'none';
  });
}

}
</script>
