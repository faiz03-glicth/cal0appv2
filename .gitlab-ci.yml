stages:
  - analyze
  - quality
  - build
  - deploy

variables:
  DOCR_REPO: registry.digitalocean.com/cal0appv2-registry/cal0appv2
  DO_APP_NAME: cal0appv2-apk-download
  GIT_DEPTH: "0"

# ===========================================================
# Existing: admin_portal → Firebase Hosting (unchanged)
# ===========================================================
deploy_admin_portal:
  image: node:20
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - admin_portal/**/*
        - firebase.json
        - .firebaserc
  before_script:
    - npm install -g firebase-tools
    - echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
  script:
    - firebase deploy --only hosting --project cal0app --non-interactive

# ===========================================================
# Flutter app → APK download page (+ QR code) on DigitalOcean
# ===========================================================
flutter_analyze:
  stage: analyze
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos --no-fatal-warnings
    - flutter test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - lib/**/*
        - android/**/*
        - assets/**/*
        - pubspec.yaml
        - .gitlab-ci.yml

sonarqube_scan:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - lib/**/*
        - android/**/*
        - assets/**/*
        - pubspec.yaml
        - .gitlab-ci.yml
  allow_failure: false

build_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
    - export ANDROID_KEYSTORE_PATH=$(pwd)/android/app/release.jks
    - ls -la assets/ml/model.onnx
    - docker login registry.digitalocean.com -u "$DO_API_TOKEN" -p "$DO_API_TOKEN"
    - docker build
        --build-arg ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH
        --build-arg ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
        --build-arg ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS
        --build-arg ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
        --build-arg GEMINI_API_KEY=$GEMINI_API_KEY
        -t $DOCR_REPO:$CI_COMMIT_SHORT_SHA -t $DOCR_REPO:latest .
    - docker push $DOCR_REPO:$CI_COMMIT_SHORT_SHA
    - docker push $DOCR_REPO:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - lib/**/*
        - android/**/*
        - assets/**/*
        - pubspec.yaml
        - .gitlab-ci.yml
        - Dockerfile
        - nginx.conf
        - index.html

deploy_do:
  stage: deploy
  image:
    name: digitalocean/doctl:latest
    entrypoint: [""]
  when: manual
  script:
    - 'sed -i "s/tag: latest/tag: $CI_COMMIT_SHORT_SHA/" .do/app.yaml'
    - /app/doctl auth init -t "$DO_API_TOKEN"
    - /app/doctl apps update $(/app/doctl apps list --format ID,Spec.Name --no-header | grep "$DO_APP_NAME" | awk '{print $1}') --spec .do/app.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - lib/**/*
        - android/**/*
        - assets/**/*
        - pubspec.yaml
        - .gitlab-ci.yml
        - Dockerfile
        - nginx.conf
        - index.html